<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>妖怪まつり びっくらぽん</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main id="stage" class="state-idle" aria-live="polite">
    <nav class="game-nav" aria-label="画面操作">
      <div class="game-nav-brand">
        <span>祭</span>
        <strong>びっくらぽん</strong>
      </div>
      <div class="game-nav-tabs">
        <button class="nav-button active" type="button" aria-current="page">ゲーム</button>
        <button id="nav-admin" class="nav-button" type="button">管理画面</button>
      </div>
      <div class="game-nav-actions">
        <button id="nav-fullscreen" class="nav-button action" type="button">全画面にする</button>
        <button id="nav-hide-game" class="nav-button action" type="button">画面を隠す</button>
        <button id="nav-close-app" class="nav-button danger" type="button">ゲーム画面を閉じる</button>
      </div>
    </nav>

    <div class="forest-ambience" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div id="connection-state" class="connection-pill is-offline">
      <span class="connection-dot"></span>
      <span class="connection-label">準備中</span>
    </div>

    <section id="idle-screen" class="screen idle-screen">
      <div class="shrine-title">
        <p>御神木の運だめし</p>
        <h1><span>妖怪まつり</span>びっくらぽん！</h1>
      </div>
      <div class="machine-focus" aria-hidden="true"><span></span></div>
      <div class="instruction-card">
        <span class="coin-icon" aria-hidden="true">￥</span>
        <div>
          <strong>コインを通してね！</strong>
          <small>御神木のガチャが目を覚ますよ</small>
        </div>
      </div>
    </section>

    <section id="playing-screen" class="screen playing-screen hidden">
      <div class="ritual-panel">
        <p class="eyebrow"><span></span>御神木の抽選中<span></span></p>
        <div class="spirit-wheel" aria-hidden="true">
          <div class="wheel-ring ring-outer"></div>
          <div class="wheel-ring ring-inner"></div>
          <div id="roulette-symbol" class="roulette-symbol">?</div>
        </div>
        <h2>ガチャがまわっているよ！</h2>
        <p id="playing-caption" class="playing-caption">木霊たちが運を選んでいます…</p>
        <div class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </section>

    <section id="video-screen" class="screen video-screen hidden">
      <video id="result-video" playsinline preload="auto"></video>
      <div class="video-test-badge">演出テスト</div>
    </section>

    <section id="result-screen" class="screen result-screen hidden">
      <p class="result-kicker">妖怪おみくじ</p>
      <div class="result-medallion" aria-hidden="true">
        <span id="result-symbol">福</span>
      </div>
      <h2 id="result-title">当たり！</h2>
      <p id="result-message">カプセルを受け取ってね</p>
    </section>

    <section id="error-screen" class="screen error-screen hidden">
      <div class="error-seal">!</div>
      <h2>うまく排出できませんでした</h2>
      <p>近くの係の人を呼んでね</p>
    </section>

    <section id="soldout-screen" class="screen soldout-screen hidden">
      <div class="closed-sign">
        <span>ただいま</span>
        <strong>準備中</strong>
      </div>
      <h2>カプセルがなくなりました</h2>
      <p>近くの巫女さんを呼んでね</p>
    </section>

    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </main>

  <script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
