name: Build Windows installer

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "成功したインストーラーをReleaseへ公開する"
        required: false
        default: false
        type: boolean
      firmware_only:
        description: "Uno用プログラムだけをZIPにして公開する（PCアプリは変更しない）"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "app/**"
      - "templates/**"
      - "static/**"
      - "config/**"
      - "run.py"
      - "bikkurapon.spec"
      - "requirements*.txt"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    if: ${{ !inputs.firmware_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r requirements-dev.txt

      # テストが落ちている状態の.exeを配布してしまわないよう、ビルド前に実行する
      - name: Run tests
        run: pytest

      - name: Build bikkurapon.exe with PyInstaller
        run: pyinstaller bikkurapon.spec

      # ビルド成功だけでなく、Windows上でexeが落ちずに起動して画面を返せるか確認する。
      - name: Smoke test packaged app on Windows
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD\dist\bikkurapon.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              if ($app.HasExited) {
                throw "bikkurapon.exe exited before startup completed (exit=$($app.ExitCode))"
              }
              curl.exe --noproxy "*" --fail --silent --max-time 2 "http://127.0.0.1:5000/api/status" *> $null
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
            }
            if (-not $ready) {
              Get-NetTCPConnection -LocalPort 5000 -ErrorAction SilentlyContinue | Format-List
              Get-ChildItem -Path "$PWD\dist" -Recurse -Filter "bikkurapon.log*" | ForEach-Object {
                Write-Host "----- $($_.FullName) -----"
                Get-Content $_.FullName
              }
              throw "bikkurapon.exe did not become ready within 30 seconds"
            }
            # 画面が開いた後も内部サーバーが固まらず応答し続けることを確認する。
            Start-Sleep -Seconds 8
            if ($app.HasExited) {
              throw "bikkurapon.exe exited after opening its windows (exit=$($app.ExitCode))"
            }
            curl.exe --noproxy "*" --fail --silent --max-time 3 "http://127.0.0.1:5000/api/status" *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "bikkurapon.exe stopped responding after opening its windows"
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bikkurapon.iss'

      - name: Upload bikkurapon.exe (portable, no installer)
        uses: actions/upload-artifact@v4
        with:
          name: bikkurapon-exe
          path: dist/bikkurapon.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BikkurapoSetup
          path: dist_installer/BikkurapoSetup.exe

      - name: Publish Windows installer release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.7.1"
          $asset = "dist_installer\BikkurapoSetup.exe"
          $firmware = "dist_installer\ArduinoUno-v2.7.1.zip"
          Compress-Archive -Path "firmware\arduino_uno_usb_serial" -DestinationPath $firmware
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $firmware --clobber
          } else {
            gh release create $tag $asset $firmware `
              --target "$env:GITHUB_SHA" `
              --title "妖怪まつり びっくらぽん v2.7.1" `
              --notes "はずれ側サーボを通常排出・長押し調整とも逆回転にしました。Arduinoの再起動や手動回転の確認をログへ詳しく表示します。PCアプリとArduinoUno-v2.7.1.zipの両方を更新してください。"
          }

  firmware:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.firmware_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Uno sketch with simulated serial and servos
        run: |
          set -e
          for sensor in true false; do
            for servo_a in true false; do
              for servo_b in true false; do
                g++ -std=c++17 -DCOIN_SENSOR_USE_CDS=$sensor -DSERVO_A_CONTINUOUS=$servo_a -DSERVO_B_CONTINUOUS=$servo_b -I tests/firmware tests/firmware/uno_protocol.cpp -o /tmp/uno-protocol-test
                /tmp/uno-protocol-test
              done
            done
          done
      - name: Package Uno sketch and upload instructions
        working-directory: firmware
        run: zip -r ../ArduinoUno-v2.7.1.zip arduino_uno_usb_serial
      - uses: actions/upload-artifact@v4
        with:
          name: ArduinoUno-v2.7.1
          path: ArduinoUno-v2.7.1.zip
      - name: Publish firmware alongside compatible PC app
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.7.1 ArduinoUno-v2.7.1.zip
