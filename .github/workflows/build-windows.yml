name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "templates/**"
      - "static/**"
      - "config/**"
      - "run.py"
      - "bikkurapon.spec"
      - "requirements*.txt"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build bikkurapon.exe with PyInstaller
        run: pyinstaller bikkurapon.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bikkurapon.iss'

      - name: Upload bikkurapon.exe (portable, no installer)
        uses: actions/upload-artifact@v4
        with:
          name: bikkurapon-exe
          path: dist/bikkurapon.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BikkurapoSetup
          path: dist_installer/BikkurapoSetup.exe
